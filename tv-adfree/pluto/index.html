<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>AdFree Pluto</title>
<style>
  :root { --bg: #0d0d12; --panel: #1a1a22; --text: #f2f2f5; --muted: #a0a0ad; --accent: #fff200; }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); color: var(--text); font-family: sans-serif; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: block; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--muted); text-align: center; padding: 0 200px; }

  /* Home */
  #hero { position: absolute; left: 80px; top: 130px; right: 80px; height: 250px; }
  #hero h1 { margin: 0 0 12px; font-size: 56px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #hero .meta { color: var(--accent); font-size: 26px; margin-bottom: 14px; }
  #hero .tip { position: absolute; right: 0; top: 112px; font-size: 22px; color: var(--muted); }
  #hero p { margin: 0; font-size: 26px; line-height: 1.4; color: var(--muted); max-width: 1200px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #rows { position: absolute; left: 0; right: 0; top: 400px; bottom: 0; overflow: hidden; }
  #rowsInner { transition: transform .25s ease; }
  .row { height: 330px; padding-left: 80px; }
  .row h2 { margin: 0 0 14px; font-size: 30px; font-weight: 600; }
  .strip { display: flex; gap: 24px; transition: transform .25s ease; }
  .card { flex: 0 0 384px; height: 216px; border-radius: 12px; background: var(--panel) center/cover no-repeat; position: relative;
          border: 4px solid transparent; transition: transform .15s, border-color .15s; }
  .card .t { position: absolute; left: 0; right: 0; bottom: 0; padding: 30px 14px 10px; font-size: 22px; border-radius: 0 0 8px 8px;
             background: linear-gradient(transparent, rgba(0,0,0,.85)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .badge { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,.7); font-size: 18px; padding: 4px 10px; border-radius: 6px; }
  .card .prog { position: absolute; left: 12px; right: 12px; bottom: 8px; height: 6px; background: rgba(255,255,255,.3); border-radius: 3px; overflow: hidden; z-index: 1; }
  .card .prog div { height: 100%; background: var(--accent); }
  .card .prog + .t { padding-bottom: 24px; }
  .card.focus { border-color: var(--accent); transform: scale(1.06); }

  /* Search */
  #searchbar { position: absolute; right: 80px; top: 36px; width: 520px; height: 72px; border-radius: 36px; background: var(--panel);
               border: 4px solid transparent; display: flex; align-items: center; padding: 0 28px; font-size: 28px; color: var(--muted); }
  #searchbar.focus { border-color: var(--accent); color: var(--text); }
  #q { flex: 1; background: transparent; border: 0; outline: 0; color: var(--text); font-size: 28px; margin-left: 14px; }
  #tabs { position: absolute; left: 80px; top: 36px; display: flex; gap: 16px; }
  #tabs span { font-size: 28px; padding: 16px 30px; border-radius: 36px; background: var(--panel); border: 4px solid transparent; }
  #tabs span.sel { background: var(--accent); color: #000; }
  #tabs span.focus { border-color: var(--accent); }
  #hero h1 { font-size: 50px; }
  #results { padding: 60px 80px; }
  #results h1 { font-size: 44px; margin: 0 0 30px; }
  #grid { position: absolute; left: 80px; right: 40px; top: 160px; bottom: 0; overflow: hidden; }
  #gridInner { display: flex; flex-wrap: wrap; gap: 36px 24px; transition: transform .2s ease; padding-top: 10px; }

  /* Series */
  #series { padding: 70px 80px; }
  #series h1 { font-size: 54px; margin: 0 0 16px; }
  #series .desc { font-size: 24px; color: var(--muted); max-width: 1500px; line-height: 1.4; margin-bottom: 30px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #seasons { display: flex; gap: 16px; margin-bottom: 24px; }
  #seasons span { font-size: 26px; padding: 10px 22px; border-radius: 30px; background: var(--panel); }
  #seasons span.sel { background: var(--accent); color: #000; }
  #episodes { position: absolute; left: 80px; right: 80px; top: 360px; bottom: 40px; overflow: hidden; }
  #epInner { transition: transform .2s ease; }
  .ep { display: flex; gap: 28px; align-items: center; height: 150px; padding: 12px; border-radius: 12px; border: 4px solid transparent; }
  .ep img { width: 224px; height: 126px; object-fit: cover; border-radius: 8px; background: var(--panel); }
  .ep .n { font-size: 28px; margin-bottom: 8px; }
  .ep .d { font-size: 21px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ep.focus { border-color: var(--accent); background: var(--panel); }
  .hint { position: absolute; right: 80px; top: 80px; font-size: 22px; color: var(--muted); }

  /* Player */
  #player { background: #000; }
  #video { width: 1920px; height: 1080px; background: #000; }
  #osd { position: absolute; left: 0; right: 0; bottom: 0; padding: 60px 80px 50px; background: linear-gradient(transparent, rgba(0,0,0,.9));
         transition: opacity .4s; }
  #osd.hide { opacity: 0; }
  #osd .title { font-size: 40px; margin-bottom: 22px; }
  #bar { height: 10px; background: rgba(255,255,255,.25); border-radius: 5px; overflow: hidden; }
  #fill { height: 100%; width: 0; background: var(--accent); }
  #osd .times { display: flex; justify-content: space-between; font-size: 24px; color: var(--muted); margin-top: 12px; }
  #toast { position: absolute; z-index: 10; top: 40px; right: 60px; background: rgba(0,0,0,.8); padding: 12px 22px; border-radius: 10px; font-size: 26px; display: none; }
</style>
</head>
<body>
<div id="status">Loading Pluto…</div>

<div id="home" class="screen">
  <div id="tabs"><span data-f="all" class="sel">All</span><span data-f="movie">Movies</span><span data-f="series">TV Shows</span></div>
  <div id="searchbar"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="text" placeholder="Search movies & shows"></div>
  <div id="hero"><h1></h1><div class="meta"></div><p></p><div class="tip"></div></div>
  <div id="rows"><div id="rowsInner"></div></div>
</div>

<div id="results" class="screen">
  <h1></h1>
  <div id="grid"><div id="gridInner"></div></div>
</div>

<div id="series" class="screen">
  <h1></h1><div class="desc"></div>
  <div id="seasons"></div>
  <div class="hint">◀ ▶ season · OK play · ⏯ Watch Later · Back return</div>
  <div id="episodes"><div id="epInner"></div></div>
</div>

<div id="player" class="screen">
  <video id="video"></video>
  <div id="osd"><div class="title"></div><div id="bar"><div id="fill"></div></div><div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div></div>
</div>

<div id="toast"></div>

<script src="vendor/hls.min.js"></script>
<script src="app.js"></script>
</body>
</html>
