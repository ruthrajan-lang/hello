<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #0f0f0f; color: #f1f1f1; font: 32px/1.4 sans-serif; }
  body { display: flex; align-items: center; justify-content: center; text-align: center; }
  #msg { max-width: 1400px; padding: 0 60px; }
  small { display: block; color: #aaa; font-size: 26px; margin-top: 24px; }
</style>
</head>
<body>
<div id="msg">Starting…</div>
<script>
"use strict";
var SERVICE = "http://127.0.0.1:8100";
var app = tizen.application.getCurrentApplication();
var msg = document.getElementById("msg");

["MediaPlayPause", "MediaPlay", "MediaPause", "MediaStop", "MediaFastForward", "MediaRewind",
 "MediaTrackNext", "MediaTrackPrevious", "ColorF0Red", "ColorF1Green", "ColorF2Yellow", "ColorF3Blue"]
  .forEach(function (k) { try { tizen.tvinputdevice.registerKey(k); } catch (e) {} });

document.addEventListener("keydown", function (e) {
  if (e.keyCode === 10009) app.exit(); // Back on the launcher screen closes the app
});

function show(text, hint) {
  msg.innerHTML = text + (hint ? "<small>" + hint + "</small>" : "");
}

function get(path) {
  return fetch(SERVICE + path).then(function (r) { return r.json(); });
}

var tries = 0;
function check() {
  get("/state").then(function (s) {
    if (s.busy) {
      // This is the debug-mode relaunch. The service attaches and opens YouTube.
      show("Loading YouTube…");
      return setTimeout(check, 1000);
    }
    if (!s.devMode) {
      return show("Developer Mode is off.",
        "Open Apps, press 1 2 3 4 5 on the remote, turn Developer Mode on, set Host PC IP to <b>127.0.0.1</b>, then restart the TV.");
    }
    if (!s.loopback) {
      return show("Almost there: Developer Mode Host PC IP is <b>" + s.hostIp + "</b>.",
        "Change it to <b>127.0.0.1</b> (Apps → 1 2 3 4 5), then restart the TV. Set it back to your computer's IP only when you need to reinstall.");
    }
    get("/launch").then(function () { app.exit(); });
  }).catch(function () {
    if (++tries > 40) return show("The background service didn't start.", "Fully restart the TV (hold Power until the logo appears) and try again.");
    setTimeout(check, 250);
  });
}

tizen.application.launchAppControl(
  new tizen.ApplicationControl("http://tizen.org/appcontrol/operation/service"),
  app.appInfo.packageId + ".Injector",
  check,
  function (e) { show("Couldn't start the background service.", e.message); }
);
</script>
</body>
</html>
